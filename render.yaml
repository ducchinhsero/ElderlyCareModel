# Render.com blueprint for the read-only cloud reader.
# Create the service: Render dashboard → New → Blueprint → point at this repo.
# Then set MONGODB_URI and CLOUD_API_KEY as (secret) env vars in the dashboard.
services:
  - type: web
    name: elderly-care-cloud-reader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn src.api.cloud_reader:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false          # set as a secret in the dashboard
      - key: MONGODB_DB
        value: elderly_care
      - key: CLOUD_API_KEY
        sync: false          # set as a secret; the app sends it as X-API-Key
      - key: CLOUD_API_AUTH_ENABLED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.6"
